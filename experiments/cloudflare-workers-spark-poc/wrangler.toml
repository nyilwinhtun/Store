name = "minimart-spark-sales-poc"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = false

# Free plan only. No account_id, no routes, no paid features.
# Secrets are set with:  npx wrangler secret put FIRESTORE_SERVICE_ACCOUNT
# Never place the service-account JSON in this file, in Git, or in the APK.

[vars]
FIREBASE_PROJECT_ID = "minimart-production"
BUSINESS_ID = "store-mini-main"
CHECK_TOKEN_REVOCATION = "true"

# Expiry transitions are recorded without releasing reserved stock. This cron is
# inert until a Staging Worker is explicitly deployed.
[triggers]
crons = ["15 * * * *"]
